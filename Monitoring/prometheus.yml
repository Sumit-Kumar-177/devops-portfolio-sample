  # ===========================
  # DC3: Microhost
  # ===========================

  # --- Node Exporter ---
  - job_name: 'node_exporter_Microhost'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '103.189.89.149:9100'
          - '150.241.246.101:9100'
          - '150.241.247.19:9100'
        labels:
          dc: 'Microhost'
          service: 'node'

  # --- MySQL Exporter ---
  - job_name: 'mysql_exporter_Microhost'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '103.189.89.149:9104'
          - '150.241.246.101:9104'  
        labels:
          dc: 'Microhost'
          service: 'mysql'

  # --- Asterisk Exporter ---
  - job_name: 'asterisk_exporter_Microhost'
    scrape_interval: 60s
    scrape_timeout: 50s
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - '103.189.89.149:9700'
        labels:
          dc: 'Microhost'
          service: 'asterisk'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
          
