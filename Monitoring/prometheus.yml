# ===========================
# Global Configuration
# ===========================
global:
  scrape_interval: 15s

# ===========================
# Alertmanager Configuration
# ===========================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'  # Alertmanager host

# ===========================
# Alert Rules
# ===========================
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ===========================
# Scrape Configurations
# ===========================

scrape_configs:

  # ===========================
  # DC1: Triple-Play
  # ===========================

  # --- Node Exporter ---
  - job_name: 'node_exporter_Triple-Play'
    scrape_interval: 1s
    static_configs:
      - targets:
          - '150.242.73.28:9100'
          - '150.242.73.250:9100'
          - '150.242.73.252:9100'
          - '150.242.73.35:9100'
          - '150.242.73.251:9100'
          - '150.242.73.138:9100'   
          - '150.242.73.13:9100'
          - '150.242.73.11:9100'
          - '150.242.73.14:9100'
          - '150.242.73.132:9100'
          - '150.242.73.132:9111'
          - '150.242.73.132:9112'  
          - '150.242.74.142:9100'
          - '150.242.73.30:9100'
          - '150.242.73.243:9100'
          - '150.242.74.141:9100'
          - '150.242.73.26:9100'
          - '150.242.73.27:9100'
          - '150.242.73.25:9100'  
          - '150.242.73.238:9100'
          - '150.242.73.36:9100'
          - '150.242.73.18:9100'
        labels:
          dc: 'Triple-Play'
          service: 'node'

  # --- MySQL Exporter ---
  - job_name: 'mysql_exporter_Triple-Play'
    scrape_interval: 25s
    scrape_timeout: 15s  
    static_configs:
      - targets:
          - '150.242.73.250:9104'
          - '150.242.73.26:9104'
          - '150.242.73.27:9104'
          - '150.242.73.13:9104'
          - '150.242.73.11:9104'
          - '150.242.73.14:9104'
          - '150.241.247.19:9104'
          - '150.242.74.142:9104'
          - '150.242.73.30:9104'
          - '150.242.73.243:9104'  
        labels:
          dc: 'Triple-Play'
          service: 'mysql'

  # --- Asterisk Exporter ---
  - job_name: 'asterisk_exporter_Triple-Play'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '150.241.247.19:9700'
        labels:
          dc: 'Triple-Play'
          service: 'asterisk'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

