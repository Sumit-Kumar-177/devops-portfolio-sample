---
- name: Provision and configure a web server
  hosts: webservers
  become: true

  vars:
    app_dir: /var/www/html

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Apache and PHP
      apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
        state: present

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: true

    - name: Deploy application code
      copy:
        src: ../app/index.php
        dest: "{{ app_dir }}/index.php"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Open firewall for HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Restart Apache to apply changes
      service:
        name: apache2
        state: restarted
